name: PhoneCleaner
options:
  bundleIdPrefix: com.cleanupphotos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ZUCC9R4PP4
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  PhoneCleaner:
    type: application
    platform: iOS
    sources:
      - path: PhoneCleaner
        excludes:
          - "**/*.storekit"
      - path: PhoneCleaner/Store/Products.storekit
        buildPhase: none
    info:
      path: PhoneCleaner/Info.plist
      properties:
        CFBundleDisplayName: Phone Cleaner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSPhotoLibraryUsageDescription: Phone Cleaner looks through the photos and videos on your iPhone to find duplicates, similar shots, screenshots and large videos you may want to delete. The scan runs on your device and nothing is uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanupphotos.app
        PRODUCT_NAME: PhoneCleaner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  PhoneCleaner:
    build:
      targets:
        PhoneCleaner: all
    run:
      config: Debug
      storeKitConfiguration: PhoneCleaner/Store/Products.storekit
    archive:
      config: Release
