name: PhoneCleaner
options:
  bundleIdPrefix: com.cleanupphotos
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ZUCC9R4PP4
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  PhoneCleaner:
    type: application
    platform: iOS
    sources:
      - path: PhoneCleaner
        excludes:
          - "**/*.storekit"
      - path: PhoneCleaner/Store/Products.storekit
        buildPhase: none
    info:
      path: PhoneCleaner/Info.plist
      properties:
        CFBundleDisplayName: Shotfile
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSPhotoLibraryUsageDescription: Shotfile reads the text in your screenshots to sort them and make them searchable, and looks through your photos to find duplicates and Live Photos you can turn into stills. Everything happens on your iPhone and nothing is uploaded.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanupphotos.app
        PRODUCT_NAME: PhoneCleaner
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  PhoneCleaner:
    build:
      targets:
        PhoneCleaner: all
    run:
      config: Debug
      storeKitConfiguration: PhoneCleaner/Store/Products.storekit
    archive:
      config: Release
